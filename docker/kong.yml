# ============================================================
# Configuration dÃ©clarative Kong â€” reproduit le routage Supabase cloud.
# L'URL unique http://localhost:8000 expose :
#   /auth/v1/*  -> GoTrue
#   /rest/v1/*  -> PostgREST
# C'est ce que le client @supabase/supabase-js attend.
# ============================================================
_format_version: "2.1"

services:
  - name: auth-v1
    url: http://auth:9999
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1
    plugins:
      - name: cors

  - name: rest-v1
    url: http://rest:3000
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1
    plugins:
      - name: cors

  - name: realtime-v1
    url: http://realtime-dev:4000/socket
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1
    plugins:
      - name: cors
